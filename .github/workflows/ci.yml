name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  # Ermittelt, ob der PR Code berührt. Reine Text-Änderungen (Specs, Doku, Markdown außerhalb
  # von src/, public/, tests/) brauchen weder E2E noch Lighthouse. Auf main läuft immer alles.
  # Liefert außerdem die Playwright-Version aus der package-lock.json für das passende Image.
  changes:
    name: Änderungen erkennen
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      playwright: ${{ steps.pw.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BASE...$HEAD")
          echo "Geänderte Dateien:"; echo "$files"
          code=$(echo "$files" | grep -vE '^(specs/|docs/|\.specify/|\.claude/)' \
            | grep -vE '^([^/]+|design/.*|\.github/.*)\.md$' | grep -q . && echo true || echo false)
          echo "Code betroffen: $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - id: pw
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

  quality:
    name: Lint, Typen, Unit-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run tokens
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:cov
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  build:
    name: Build, Kontrast, Bundle-Budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run contrast
      - run: npm run budget
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  # Je Profil ein eigener Rechner (parallel). Das offizielle Playwright-Image bringt Browser und
  # Systempakete mit, die Version folgt automatisch der package-lock.json (Job "changes").
  e2e:
    name: E2E (${{ matrix.profile }})
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.changes.outputs.playwright }}-noble
    strategy:
      fail-fast: false
      matrix:
        profile: [iphone, iphone-se, android]
    env:
      PW_PROJECTS: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ matrix.profile }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  lighthouse:
    name: Lighthouse
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: npx --yes @lhci/cli@0.15.1 autorun
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci/
          retention-days: 14

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          fail-on-scopes: runtime
          deny-licenses: GPL-3.0-only, AGPL-3.0-only

  # Sammel-Check: wird im Ruleset für main als Pflicht-Check eingetragen.
  ci:
    name: ci
    if: always()
    needs: [changes, quality, build, e2e, lighthouse, dependency-review]
    runs-on: ubuntu-latest
    steps:
      - name: Ergebnis aller Jobs prüfen
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Ergebnisse: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "Mindestens ein Job ist nicht erfolgreich: $r"
              exit 1
            fi
          done
