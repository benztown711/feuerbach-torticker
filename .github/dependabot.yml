version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
    commit-message:
      prefix: build
      include: scope
    groups:
      minor-und-patch:
        update-types: [minor, patch]
    ignore:
      # research.md R-14: typescript-eslint unterstützt TypeScript 7 noch nicht; Wechsel bewusst von Hand.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
